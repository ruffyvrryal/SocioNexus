<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocioNexus — Multi-Account Content & Analytics Hub</title>
  
  <!-- Favicon fix -->
  <link rel="icon" href="data:," />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#07090e',
              card: '#0f1422',
              cardBorder: '#1e293b',
              accent: '#3b82f6',
              tiktokCyan: '#00f2fe',
              tiktokPink: '#ff0050',
              igPurple: '#833ab4',
              igRed: '#fd1d1d',
              igOrange: '#fcb045',
              ytRed: '#ff0000',
            }
          }
        }
      }
    }
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #07090e;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .glass-card {
      background: rgba(15, 20, 34, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover:hover {
      border-color: rgba(59, 130, 246, 0.4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.15);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar selection:bg-blue-500 selection:text-white">

  <!-- TOP HEADER / NAVBAR -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Logo & Brand Name -->
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateToHub()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-500 to-pink-500 p-0.5 shadow-lg shadow-blue-500/20">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i data-lucide="share-2" class="w-5 h-5 text-blue-400"></i>
          </div>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-blue-400">
            SocioNexus
          </span>
          <span class="block text-[10px] text-slate-400 tracking-wider font-semibold uppercase">Cloud Analytics</span>
        </div>
      </div>

      <!-- Header Active Workspace & Quick Nav -->
      <div id="headerWorkspaceInfo" class="hidden md:flex items-center space-x-3">
        <div class="flex items-center space-x-2 bg-slate-900/80 border border-slate-800 px-3 py-1.5 rounded-lg">
          <div id="headerAccountAvatar" class="w-6 h-6 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs">
            A
          </div>
          <span id="headerAccountName" class="text-sm font-medium text-slate-200">Alex Rivera</span>
        </div>
        
        <button onclick="navigateToHub()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-3 py-1.5 rounded-lg transition border border-slate-700/50 flex items-center space-x-1.5">
          <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
          <span>Switch Account</span>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-3">
        <!-- Cloud Status Indicator -->
        <button onclick="openCloudModal()" id="cloudStatusBtn" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border text-xs font-medium transition bg-emerald-500/10 text-emerald-400 border-emerald-500/30">
          <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
          <span id="cloudStatusText">Cloud Connected</span>
        </button>

        <!-- New Post Action Button (Visible inside workspace) -->
        <button id="addPostNavBtn" onclick="openPostModal()" class="hidden md:flex items-center space-x-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-lg shadow-lg shadow-blue-600/20 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add Post</span>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">

    <!-- VIEW 1: ACCOUNT SELECTION HUB (LANDING VIEW) -->
    <section id="accountHubView" class="space-y-8">
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800/80 pb-6">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight text-white">Select Account</h1>
          <p class="text-slate-400 text-sm mt-1">Choose a brand or user profile to access platform content and analytics workspace.</p>
        </div>

        <button onclick="openAccountModal()" class="inline-flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-lg shadow-blue-600/25">
          <i data-lucide="user-plus" class="w-4 h-4"></i>
          <span>Create New Profile</span>
        </button>
      </div>

      <!-- Account Cards Grid -->
      <div id="accountCardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Account Cards Render Here -->
      </div>

    </section>

    <!-- VIEW 2: ACCOUNT WORKSPACE (OVERVIEW / TIKTOK / INSTAGRAM / YOUTUBE) -->
    <section id="workspaceView" class="hidden space-y-8">

      <!-- Workspace Top Bar & Navigation -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 glass-card">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
          
          <!-- Account Identity Header -->
          <div class="flex items-center space-x-4">
            <div id="wsAvatar" class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-black text-2xl shadow-xl">
              A
            </div>
            <div>
              <div class="flex items-center space-x-3">
                <h2 id="wsAccountName" class="text-2xl font-bold text-white">Alex Rivera</h2>
                <span id="wsAccountNiche" class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
                  Tech & Lifestyle
                </span>
              </div>
              <p id="wsAccountHandle" class="text-slate-400 text-sm font-mono mt-0.5">@alexrivera_tech</p>
            </div>
          </div>

          <!-- Account Actions & Timeframe Filter -->
          <div class="flex flex-wrap items-center gap-3">
            
            <!-- Edit Account Button -->
            <button onclick="openEditAccountModal()" class="px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition border border-slate-700/60 flex items-center space-x-1.5">
              <i data-lucide="edit-3" class="w-3.5 h-3.5 text-blue-400"></i>
              <span>Edit Account</span>
            </button>

            <!-- Delete Account Button -->
            <button onclick="confirmDeleteAccount()" class="px-3 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 text-xs font-semibold transition border border-red-500/30 flex items-center space-x-1.5">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              <span>Delete Account</span>
            </button>

            <!-- Return to Hub -->
            <button onclick="navigateToHub()" class="px-3 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition border border-slate-700/60 flex items-center space-x-1.5">
              <i data-lucide="layout-grid" class="w-3.5 h-3.5 text-slate-400"></i>
              <span>All Accounts</span>
            </button>

            <!-- Add Post CTA -->
            <button onclick="openPostModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-semibold transition shadow-md shadow-blue-600/20 flex items-center space-x-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Add Entry</span>
            </button>

          </div>

        </div>

        <!-- Platform Tabs Navigation -->
        <div class="flex items-center space-x-2 border-t border-slate-800/80 mt-6 pt-6 overflow-x-auto custom-scrollbar">
          
          <button onclick="switchPlatformTab('overview')" id="tab-overview" class="platform-tab px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 bg-blue-600 text-white shadow-lg shadow-blue-600/25">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Overview</span>
          </button>

          <button onclick="switchPlatformTab('tiktok')" id="tab-tiktok" class="platform-tab px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/60">
            <i data-lucide="video" class="w-4 h-4 text-cyan-400"></i>
            <span>TikTok</span>
          </button>

          <button onclick="switchPlatformTab('instagram')" id="tab-instagram" class="platform-tab px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/60">
            <i data-lucide="instagram" class="w-4 h-4 text-pink-400"></i>
            <span>Instagram</span>
          </button>

          <button onclick="switchPlatformTab('youtube')" id="tab-youtube" class="platform-tab px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/60">
            <i data-lucide="youtube" class="w-4 h-4 text-red-500"></i>
            <span>YouTube</span>
          </button>

        </div>
      </div>

      <!-- TIMEFRAME & DATE RANGE CONTROLS -->
      <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
        
        <div class="flex items-center space-x-2">
          <i data-lucide="calendar" class="w-4 h-4 text-blue-400"></i>
          <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Timeframe Filter</span>
        </div>

        <!-- Mode Selectors: All Time / Weekly / Monthly -->
        <div class="flex items-center space-x-2">
          
          <button onclick="setTimeframeMode('all')" id="tfBtnAll" class="tf-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-600 text-white">
            All Time
          </button>

          <button onclick="setTimeframeMode('weekly')" id="tfBtnWeekly" class="tf-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-800 text-slate-300 hover:bg-slate-700">
            Weekly Range
          </button>

          <button onclick="setTimeframeMode('monthly')" id="tfBtnMonthly" class="tf-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-800 text-slate-300 hover:bg-slate-700">
            Monthly
          </button>

        </div>

        <!-- Weekly Date Range Selector Inputs -->
        <div id="weeklyDateControls" class="hidden flex flex-wrap items-center gap-2">
          <input type="date" id="startDateInput" onchange="applyDateRangeFilter()" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500" />
          <span class="text-slate-500 text-xs">to</span>
          <input type="date" id="endDateInput" onchange="applyDateRangeFilter()" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500" />
          
          <button onclick="setThisWeekPreset()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">
            This Week
          </button>
          <button onclick="setLastWeekPreset()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded border border-slate-700">
            Last Week
          </button>
        </div>

        <!-- Monthly Selector Inputs -->
        <div id="monthlyDateControls" class="hidden flex items-center space-x-2">
          <select id="monthSelect" onchange="applyDateRangeFilter()" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500">
            <option value="0">January</option>
            <option value="1">February</option>
            <option value="2">March</option>
            <option value="3">April</option>
            <option value="4">May</option>
            <option value="5">June</option>
            <option value="6">July</option>
            <option value="7">August</option>
            <option value="8">September</option>
            <option value="9">October</option>
            <option value="10">November</option>
            <option value="11">December</option>
          </select>

          <select id="yearSelect" onchange="applyDateRangeFilter()" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-blue-500">
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026" selected>2026</option>
            <option value="2027">2027</option>
          </select>
        </div>

      </div>

      <!-- ANALYTICS SUMMARY CARDS GRID -->
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4">
        
        <!-- Card 1: Impression -->
        <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-4 glass-card">
          <div class="flex items-center justify-between text-slate-400 mb-1">
            <span class="text-[11px] font-semibold uppercase tracking-wider">Impression</span>
            <i data-lucide="eye" class="w-3.5 h-3.5 text-blue-400"></i>
          </div>
          <p id="kpiImpression" class="text-xl font-extrabold text-white">0</p>
          <div id="growthImpression" class="mt-1 text-[10px] font-semibold flex items-center space-x-1 text-slate-400">
            <span>-- vs prior</span>
          </div>
        </div>

        <!-- Card 2: Reach -->
        <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl
